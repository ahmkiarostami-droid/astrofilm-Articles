<main class="wrap"><section class="intro"><b>۱۰۰ مقاله اختصاصی</b><br>مقاله‌های سینمایی Astrofilm. روی هر عنوان بزنید تا متن مقاله همان‌جا باز شود.</section><section class="grid"><button class="card" data-id="a1"><b>01</b><span>بهترین فیلم‌های اکشن؛ ۱۰ انتخاب برای یک شب پرهیجان</span><small>فیلم · اکشن</small><em>←</em></button><button class="card" data-id="a2"><b>02</b><span>بهترین فیلم‌های علمی‌تخیلی که ذهن شما را درگیر می‌کنند</span><small>فیلم · علمی‌تخیلی</small><em>←</em></button><button class="card" data-id="a3"><b>03</b><span>بهترین فیلم‌های ترسناک برای یک شب دلهره‌آور</span><small>فیلم · ترسناک</small><em>←</em></button><button class="card" data-id="a4"><b>04</b><span>بهترین فیلم‌های زامبی؛ از کلاسیک‌ها تا آثار مدرن</span><small>فیلم · زامبی</small><em>←</em></button><button class="card" data-id="a5"><b>05</b><span>بهترین فیلم‌های جنایی و معمایی برای علاقه‌مندان به پرونده‌های پیچیده</span><small>فیلم · جنایی</small><em>←</em></button><button class="card" data-id="a6"><b>06</b><span>بهترین فیلم‌های عاشقانه؛ داستان‌هایی که ماندگار می‌شوند</span><small>فیلم · عاشقانه</small><em>←</em></button><button class="card" data-id="a7"><b>07</b><span>بهترین فیلم‌های کمدی برای وقتی که فقط می‌خواهید بخندید</span><small>فیلم · کمدی</small><em>←</em></button><button class="card" data-id="a8"><b>08</b><span>بهترین فیلم‌های جنگی با داستان‌های فراتر از میدان نبرد</span><small>فیلم · جنگی</small><em>←</em></button><button class="card" data-id="a9"><b>09</b><span>بهترین فیلم‌های روان‌شناختی که پایانشان شما را غافلگیر می‌کند</span><small>فیلم · روان‌شناختی</small><em>←</em></button><button class="card" data-id="a10"><b>10</b><span>بهترین فیلم‌های ماجراجویی برای سفر به دنیاهای ناشناخته</span><small>فیلم · ماجراجویی</small><em>←</em></button><button class="card" data-id="a11"><b>11</b><span>بهترین فیلم‌های فانتزی و جهان‌هایی که نمی‌خواهند تمام شوند</span><small>فیلم · فانتزی</small><em>←</em></button><button class="card" data-id="a12"><b>12</b><span>بهترین فیلم‌های تاریخی برای علاق
